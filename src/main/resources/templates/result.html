<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Скопировать ссылку</title>
    <link rel="stylesheet" href="/styles/styles.css" type="text/css"/>
    <script>
        function copyPassToClipboard() {
            let copyLink = document.getElementById("linkToCopy");
            let copyPass = document.getElementById("passToCopy");
            let copyButton = document.getElementById("copyPassButton");
            navigator.clipboard.writeText(copyLink.textContent.concat('\n',copyPass.textContent)).then(function() {
                copyButton.textContent = "Ссылка и пароль скопированы!";
            }, function(err) {
                copyButton.textContent = "Ошибка при копировании";
            });
        }
    </script>
</head>
<body>
<h1>Ваши ссылка и пароль готовы</h1>
<p id="linkToCopy" th:text="${link}"></p>
<p id="passToCopy" th:text="${password}"></p>
<button id="copyPassButton" onclick="copyPassToClipboard()">Скопировать ссылку и пароль</button>
</body>
</html>
