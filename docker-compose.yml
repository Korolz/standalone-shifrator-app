services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    ports:
     # - 80:80
      - 443:443
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./src/main/resources/static:/var/www/html
      - /home/shifrator/cypher5.mooo.com_ecc:/certs
      - /home/shifrator/standalone-shifrator-app/dhparam:/etc/ssl/certs
    networks:
      - app-network
  webapp:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_HOST_NAME: cypher5.mooo.com
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres
    restart: on-failure
    volumes:
      - config:/app/config
    networks:
      - app-network
  postgres:
    image: "postgres:latest"
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: shifratordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
volumes:
  postgres-data:
  web-root:
  config:
  certs:
  dhparam:
    driver: local
    driver_opts:
      type: none
      device: /home/shifrator/standalone-shifrator-app/dhparam/
      o: bind
networks:
  app-network:
    driver: bridge
